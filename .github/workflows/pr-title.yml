# A PR's title becomes its squash commit (squash-only merges, title = PR title), and release-please groups the
# CHANGELOG by its type, so it must follow Conventional Commits (feat:, fix:, docs:, chore:, test:, ci:, …; feat!: or
# a BREAKING CHANGE footer for a breaking change). D46. Reads the title only; no checkout, no secrets.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
