# A PR's title becomes its squash commit (squash-only merges, title = PR title), and release-please groups the
# CHANGELOG by its type, so it must follow Conventional Commits (feat:, fix:, docs:, chore:, test:, ci:, …; feat!: or
# a BREAKING CHANGE footer for a breaking change). D46. Reads the title only; no checkout, no secrets.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
