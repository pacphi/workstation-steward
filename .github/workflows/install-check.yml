# The steward installed on a fresh machine the way a maintainer's machine runs it (D41, D48), on a macOS runner and in a
# container for every row of test/containers/matrix.json (parity 1d, T.4 and T.7), each running tools/install-check.sh:
# a worktree at the commit, the config and mise's link, steward check, and the Claude Code skills plugin (a runner is not
# a Claude Code session, so the plugin's command is accepted with --yes); for a released version, npm mode too, then
# back to the worktree. Two ways to start it, by hand only; read-only, no secrets, nothing published:
#   gh workflow run install-check.yml -f ref=<commit of main>   before a release: worktree mode on every row (R-2)
#   gh workflow run install-check.yml -f version=X.Y.Z          after it: npm mode as well, where its package.json os allows
# The tooling (the script, linux-test.js, the rows) comes from this workflow's own commit; what is installed, from the
# ref or the tag: an older tag has neither the script nor the list. A ref not on main runs too, and its summary says it
# doesn't count for the release bar (owner, 2026-11-03).
name: Install check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: A commit to check in worktree mode (a SHA, or main); give this or version
        required: false
        default: ''
      version:
        description: A released version to check (X.Y.Z), worktree then npm mode; give this or ref
        required: false
        default: ''
      release_age_days:
        description: For this run only, the config's release-age gate in days (empty keeps the config's 3)
        required: false
        default: ''
      claude_code:
        description: The Claude Code version for the plugin step (npm @anthropic-ai/claude-code)
        required: true
        default: '2.1.312'

permissions:
  contents: read

concurrency: install-check

defaults:
  run:
    shell: bash

env:
  NO_PROGRESS: '1'
  NO_COLOR: '1'

jobs:
  # The inputs, what is installed, and the rows: every row of matrix.json, the same list the tests use (T.1; owner, 2026-11-03)
  rows:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.ref }}
      V: ${{ inputs.version }}
      CLAUDE_CODE: ${{ inputs.claude_code }}
      RELEASE_AGE_DAYS: ${{ inputs.release_age_days }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/tooling/examples/mise/config.toml
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/tooling/mise:${{ github.workspace }}/subject/mise
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - name: The inputs, exactly one of ref and version
        run: |
          if [[ -n "$REF" && -n "$V" || -z "$REF" && -z "$V" ]]; then echo "give exactly one of ref and version"; exit 1; fi
          [[ -z "$V" || "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version is not X.Y.Z: $V"; exit 1; }
          [[ -z "$REF" || "$REF" == main || "$REF" =~ ^[0-9a-f]{7,40}$ ]] || { echo "ref is not a commit SHA or main: $REF"; exit 1; }
          [[ "$CLAUDE_CODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "claude_code is not X.Y.Z: $CLAUDE_CODE"; exit 1; }
          [[ -z "$RELEASE_AGE_DAYS" || "$RELEASE_AGE_DAYS" =~ ^[0-9]+$ ]] || { echo "release_age_days is not a number"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          ref: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.21
          install: false
      # linux-test.js on the example toolchain's Node (26), as in test.yml, not the runner's own
      - run: mise install node
      - id: rows
        run: node tooling/tools/linux-test.js ci
      - name: What is installed
        run: |
          sha="$(git -C subject rev-parse HEAD)"
          if git -C subject merge-base --is-ancestor HEAD refs/remotes/origin/main; then on="on main: yes"; else on="NOT on main: doesn't count for the release bar"; fi
          echo "## Install check: ${V:+workstation-steward $V at }${sha} (${on})" >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: rows
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      IC_VERSION: ${{ inputs.version }}
      RELEASE_AGE_DAYS: ${{ inputs.release_age_days }}
      CLAUDE_CODE: ${{ inputs.claude_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          ref: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
          fetch-depth: 0
      # mise puts tools on PATH with `mise activate` (no shims), as on a maintainer's Mac, so dropping the npm pin hands
      # `steward` back to the worktree's launcher
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.21
          install: false
          add_shims_to_path: false
          export_path: false
      - name: The install check, on the Mac runner
        run: bash tooling/tools/install-check.sh "${{ github.workspace }}/subject"

  # Each Linux row in its container, as `just linux-test <id> --install-check` runs it on a Mac: the row's image with a
  # fresh home and an empty mise, the network on, read-only, as a non-root user (owner, 2026-11-03)
  linux:
    needs: rows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.rows.outputs.rows) }}
    name: linux (${{ matrix.row }})
    env:
      IC_VERSION: ${{ inputs.version }}
      RELEASE_AGE_DAYS: ${{ inputs.release_age_days }}
      CLAUDE_CODE: ${{ inputs.claude_code }}
      IC_SUBJECT: ${{ github.workspace }}/subject
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/tooling/examples/mise/config.toml
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/tooling/mise:${{ github.workspace }}/subject/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          ref: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.21
          install: false
      - run: mise install node
      - name: just linux-test ${{ matrix.row }} --install-check
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: node tooling/tools/linux-test.js run "${{ matrix.row }}" --install-check
      - name: The row's log
        if: ${{ always() }}
        run: cat "${RUNNER_TEMP}"/state/workstation-steward/linux-test/*.txt 2>/dev/null | tail -n 300 || true
