# Releases (D46). On every push to main, release-please keeps one release PR open: the next version (from the
# Conventional Commit types since the last release) and the rolling, grouped CHANGELOG.md. GitHub holds the checks of
# a PR this workflow opens or updates until a maintainer approves them ("Approve workflows to run"); the approved runs
# are the PR's required checks (docs/maintainers.md; close and reopen also runs them). Merging it
# tags vX.Y.Z and creates the GitHub release; then the tagged commit is tested on macOS and published to npm with
# Trusted Publishing (OIDC, no token) and provenance, after tools/publish-guard.js agrees. Started by hand with a tag
# (gh workflow run release.yml -f tag=vX.Y.Z), it tests and publishes a release that already exists. The npm side is
# set up once by the maintainer: docs/maintainers.md. The `npm` environment (the only one npm's trust accepts) runs only
# from main, `v*` tags can't be moved or deleted, and publish checks out the exact commit the test job tested.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to test and publish (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release commit, tag and GitHub release
      pull-requests: write   # the release PR
      issues: write          # its labels
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    # a release just created, or an existing one named by hand
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      STEWARD_INSTANCE: ${{ github.workspace }}/examples
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/examples/mise/config.toml
      NO_PROGRESS: '1'
    steps:
      - name: Which release (a vX.Y.Z tag; nothing else is accepted)
        id: which
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.which.outputs.tag }}
          fetch-depth: 0
      - name: The tagged commit is on main
        id: commit
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "the tag's commit is not on main"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
          install: false
      - run: mise install
      - run: npm ci --ignore-scripts --prefix tools/types
      - run: just test
      - run: just lint

  publish:
    needs: [release-please, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: macos-latest   # the package is macOS-only (os: darwin)
    environment: npm
    permissions:
      contents: read
      id-token: write       # npm Trusted Publishing (OIDC) and provenance
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/examples/mise/config.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.sha }}   # exactly the commit the test job tested
          fetch-depth: 0    # the guard checks that HEAD is exactly the release tag
      - name: The tag still points at the tested commit
        env:
          TAG: ${{ needs.test.outputs.tag }}
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$SHA" ] || { echo "$TAG moved after it was tested"; exit 1; }
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
          install: false
      - run: mise install node npm   # npm 11.5.1 or later is needed for Trusted Publishing
      - run: mise exec -- node tools/publish-guard.js
      - run: mise exec -- npm publish --access public --provenance
