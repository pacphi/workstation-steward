# Biome and the TypeScript checker over the engine's JavaScript (D45), on every PR and push to main. A Linux runner is
# enough (neither needs macOS), so this runs in a private copy too, at the normal rate; the macOS Tests workflow runs
# `just lint` as well, with shellcheck. The tools come from the example toolchain, pinned there.
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # the release workflow starts it on the release PR (D46)

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/examples/mise/config.toml
      # a checkout that is also an instance (this private repo) has its own mise/ at the root: not this job's toolchain
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install: false # a lockfile in a parent folder would make the action use --locked (see test.yml)
      - run: mise install node biome npm:typescript
      - run: npm ci --ignore-scripts --prefix tools/types   # dev only: Node's type definitions; nothing runs
      - run: mise exec -- biome lint --error-on-warnings .
      - run: mise exec -- tsc -p tsconfig.json
