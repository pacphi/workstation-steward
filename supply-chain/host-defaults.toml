# Shared host policy that ships with the engine (D40): what anyone's `steward sc audit` checks unless their own
# supply-chain/host.toml says otherwise. A release brings the newest of it, so new indicators of compromise and
# distrusted roots reach every machine without anyone copying them.
# How your host.toml combines with this file (lib/host.js):
#   - a plain value (electron_supported_majors): yours wins;
#   - a list (always_current, vendored_node, vendored_node_dirs): yours adds to it;
#   - a named entry ([[distrusted_root]], [[ioc]], [[updater]]): yours adds one, or replaces the one with the same name;
#   - [off] in your host.toml turns a default off by name or value, e.g. always_current = ["firefox"] or
#     updater = ["brain-kb"].
# security_exception entries are yours alone: they name your versions and expire.
# An entry for some platforms only says so: `platforms = ["macos"]` on a table, or a list item written as a table,
# { name = "…", platforms = ["macos"] } (path = for a path). Without the key an entry holds on every platform.
# On Linux, `families = ["nixos"]` (debian, rhel, suse, arch, alpine, void, gentoo, slackware, nixos) narrows an entry to
# those families; it needs `platforms = ["linux"]` beside it, since an older steward ignores `families` (D63).

# Apps that bundle their own Node runtime (steward sc plan reports their versions; a path that isn't on a machine is
# skipped). Patch them by updating the app.
vendored_node = [
  { path = "/Applications/Cursor.app/Contents/Resources/app/resources/helpers/node", platforms = ["macos"] },
  "~/.cache/codex-runtimes/codex-primary-runtime/dependencies/node/bin/node",
  { path = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node", platforms = ["macos"] },
  { path = "/Applications/LM Studio.app/Contents/Resources/app/.webpack/bin/node", platforms = ["macos"] },
  "~/.lmstudio/.internal/utils/node",
]
vendored_node_dirs = ["~/.local/share/cursor-agent/versions"]   # each version folder holds its own node

# Apps (by Homebrew cask token) whose every release is a security release: browsers ship Chromium/Gecko
# security fixes in nearly every update, so they are never held by the cooldown.
always_current = [
  { name = "google-chrome", platforms = ["macos"] },
  { name = "brave-browser", platforms = ["macos"] },
  { name = "firefox", platforms = ["macos"] },
]

# Electron supports its newest majors and drops the rest from security fixes (electronjs.org/docs/latest/tutorial/
# electron-timelines: the latest three stable majors). An app bundling an older Electron is reported.
electron_supported_majors = 3

# Roots that must not be trusted. The audit (supply-chain/checks/) checks the macOS system roots, the admin trust settings,
# /etc/ssl/cert.pem, Homebrew's ca-certificates and Node's bundled store.
[[distrusted_root]]
name = "emSign ECC Root CA - G3"
sha256 = "86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B"
reason = "eMudhra intermediates with trivially weak P-384 keys, revoked 2026-10-18; removed from NSS 3.131.1"
source = "https://bugzilla.mozilla.org/buglist.cgi?quicksearch=emSign"
since = "2026-10-23"

# Indicators of compromise from published incident reports. Every path and process pattern is checked
# read-only; nothing is executed or deleted.
[[ioc]]
name = "LiteLLM 1.107.0 PyPI/Docker backdoor (2026-10-21)"
source = "https://github.com/advisories/GHSA-92x9-889m-jgmw"
files = ["/tmp/.pc_once_72129118c59f5636c0bb", "/tmp/remote_code_loader.lock"]
site_packages_files = ["cook.pth", "cook.py"]
# processes: words in a command line; environment: variables in a process's environment (checked on Linux; macOS
# shows no process environment, so there the audit says "not fully checked")
processes = ["remote_code_loader", "cook.py"]
environment = ["PRIVCOLLECT_ACTIVE"]
docker_digests = ["sha256:1bbcb1443bc962e45f5aad53fe3d2c30600e0379715fb6c664cdd3ac126c339e"]

[[ioc]]
name = "Plex2Shell (CVE-2026-96652..96656) miner/proxy payloads"
source = "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
files = []
site_packages_files = []
processes = ["myawesomeproxy", "mylovelyminer"]
docker_digests = []

# Update sources the steward doesn't install itself (D52, docs/release-classes.md): it runs each entry's commands
# through `steward sc audit`, `plan` and `upgrade`. A default is active only where its `when` path exists. Its class
# says whether it waits for the release-age gate; every class gets a backup and a receipt. A shipped `pin` is reviewed
# in the engine PR that adds or changes it (test/host-defaults.test.js checks each entry's fields).
[[updater]]
name = "brain-kb"
class = "signed_data"
when = "~/.cache/ruvnet-brain/kb/forge-update.mjs"
why = "Brain's knowledge base: a new corpus about daily, Ed25519-signed (the key is built into its updater and pinned below), content-addressed (corpus-sha256-<hash>), checked against the gated runtime before it lands; its updater takes only GitHub's releases/latest, so a 3-day gate could never be met. Reviewed 2026-10-29 at runtime 4.7.6"
check = "node ~/.cache/ruvnet-brain/kb/forge-update.mjs --check"   # exit 0 = current, 10 = behind, 2 = offline
apply = "node ~/.cache/ruvnet-brain/kb/forge-update.mjs --apply"
require_output = "source: live release asset"   # refuse its fallback to a pinned or moving source
backup = ["~/.cache/ruvnet-brain/kb"]           # about 1.4 GB; an APFS clone on macOS, so it costs little space
self_update_off = { file = "~/.cache/ruvnet-brain/.auto-update-pref", value = "no" }

[updater.pin]   # the signing key the updater checks bundles with; the text `match` finds must hash to sha256
file = "~/.cache/ruvnet-brain/kb/forge-update.mjs"
match = "-----BEGIN PUBLIC KEY-----[\\s\\S]*?-----END PUBLIC KEY-----"
sha256 = "ee12cea9da10accad46fe3a562fb392a54870576347ee99d87425d428709f103"
watch = "https://raw.githubusercontent.com/stuinfla/ruvnet-brain/main/kb/forge-update.mjs"   # the maintainer's weekly watch

# A dated entry (D72) names where its release dates are published, so a gated one is applied too: the newest version on
# the installed line that is past the release-age gate. It has no check; `installed` prints the version in use, and
# {version}, {installed} and {platform} are filled in. `verify` compares the installed file with the sha256 its vendor
# publishes for this platform; a mismatch puts back what the apply replaced.
[[updater]]
name = "claude-code"
class = "gated"
when = "~/.local/share/claude/versions"   # the native install; an npm or Homebrew one updates through those
why = "Claude Code's native build installs any exact version (`claude install <version>`) and keeps old ones beside it, but its own updater takes the newest the day it ships. Its releases are dated on npm and each build's sha256 is in Anthropic's manifest, so it waits out the gate like the tools mise installs. Reviewed 2026-11-02 at 2.1.316"
installed = "readlink ~/.local/bin/claude"   # the link names the version folder: …/versions/2.1.316
released = { npm = "@anthropic-ai/claude-code" }
apply = "~/.local/share/claude/versions/{installed} install {version}"
verify = { url = "https://downloads.claude.ai/claude-code-releases/{version}/manifest.json", json = "platforms.{platform}.checksum", file = "~/.local/share/claude/versions/{version}" }
backup = ["~/.local/bin/claude", "~/.local/share/claude/versions/{installed}"]   # the link and the build it points to
# its own updater off: either switch counts, since `claude install` moves autoUpdates into settings.json's env
self_update_off = [
  { file = "~/.claude.json", key = "autoUpdates", value = false },
  { file = "~/.claude/settings.json", key = "env.DISABLE_AUTOUPDATER", value = "1" },
]

# Where `steward sc vulns` (and the audit's vulns check) reads known vulnerabilities from (D70). Data, never code: each
# feed is a kind the engine knows how to read. Your host.toml adds one (an OSV mirror, or a folder of your own OSV
# records), replaces one of these by name, or turns one off with [off] advisory_feed = ["kev"].
#   osv-api  a server that speaks OSV's API; api.osv.dev carries the GitHub Advisory Database for npm, PyPI,
#            crates.io and Go. ecosystems = ["npm"] narrows what is asked of it.
#   osv-dir  path = a folder in your instance of OSV-format JSON records (advisories no database carries yet)
#   nodejs   nodejs.org's release index: a newer security release on the active Node line
#   kev      CISA's Known Exploited Vulnerabilities catalog: marks a finding whose CVE is being exploited
#   epss     FIRST's EPSS scores: ranks the findings by how likely each is to be exploited in the next 30 days
#   eol      endoflife.date: a runtime (node, python, postgres, go, java…) or macOS past its end of life
[[advisory_feed]]
name = "osv"
kind = "osv-api"
url = "https://api.osv.dev/v1"

[[advisory_feed]]
name = "nodejs"
kind = "nodejs"
url = "https://nodejs.org/dist/index.json"

[[advisory_feed]]
name = "kev"
kind = "kev"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

[[advisory_feed]]
name = "epss"
kind = "epss"                     # FIRST's Exploit Prediction Scoring System: ranks findings by the chance of exploitation
url = "https://api.first.org/data/v1/epss"

[[advisory_feed]]
name = "endoflife"
kind = "eol"                      # endoflife.date: a runtime, database or macOS past its end of life gets no fixes
url = "https://endoflife.date/api"

# How `steward sc vulns` judges and looks (D70). Your host.toml's [vulns] overrides any of these, key by key.
[vulns]
action_severity = "high"          # a finding at or above this is an action (review and brief list it): low, moderate, high, critical
unrated = "high"                  # the severity a finding nobody rated counts as
exploited_always_action = true    # a finding in CISA's KEV catalog is an action whatever its severity
inside_tools = true               # also check the packages inside an npm or pipx tool and inside each hybrid
hybrids = true                    # check the npm -g hybrids in the active Node
list_not_covered = true           # list the tools no feed can check (not covered is not clean)
batch_size = 500                  # queries per OSV querybatch request (1 to 1000)
parallel = 8                      # advisory records fetched at once (1 to 32)
timeout_seconds = 60              # each request to a feed (5 to 600)
go_binaries = true                # read the module list Go programs carry (mise's core, aqua and github tools)
homebrew = true                   # Homebrew's own brew vulns for its formulae (Homebrew 7 or later)
eol_severity = "high"             # the severity of a runtime or macOS past its end of life
epss_action_percentile = 0        # 1-100: an EPSS percentile at or above this makes a finding an action; 0: ranking only
# remediation: steward sc vulns-fix and steward sc isolate (D71)
fix_skip_gate = "serious"         # serious: vulns-fix pins a serious finding's fixed release though it's younger than the gate,
                                  # recording a security_exception; never: it waits for steward sc upgrade
exception_days = 7                # how long that security_exception lasts (1 to 30)
fix_majors = "list"               # list: a fix across a major (or a 0.x minor) is handed to you with its command; take: one yes covers it
cleanup = true                    # vulns-fix also removes unused old installs that carry serious advisories
cleanup_skip_soak = "serious"     # serious: that cleanup doesn't wait out the soak (those copies only); never: it waits
isolate_suggest = true            # suggest steward sc isolate for a known-exploited finding, or a critical one with no fix
isolate_never = ["node", "npm", "corepack"]   # tools never isolated
isolate_ai_owned = false          # whether isolate may switch off a tool AI tooling owns (its projects' launchers break)
