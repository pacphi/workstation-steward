<svg xmlns="http://www.w3.org/2000/svg" width="940" height="388" viewBox="0 0 940 388" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: the weekly review</title>
<desc id="d">An illustrative steward review, looping. Eight read-only stages run (soak, supply-chain audit, AI tooling, projects, your config repo, the release-age gate, the fleet), then one report lists four items to decide, each under the command that acts on it: prune now that the soak has ended, and two Homebrew updates past the release-age gate under the one command they share. Then what the gate holds back in Renovate's Dependency Dashboard: a TypeScript update that has cleared, so Renovate opens its PR, and a Node release that clears later that day, with the steward sc node-patch to run after its merge. Nothing is changed.</desc>
