<title id="t">workstation-steward: the weekly review</title>
<desc id="d">An illustrative steward review, looping. Seven read-only stages run (soak, supply-chain audit, AI tooling, projects, GitHub, fleet), then one report lists four items to decide, each with the command that acts on it: prune now that the soak has ended, two Homebrew updates past the release-age gate, and a new project to decide on. Nothing is changed.</desc>
