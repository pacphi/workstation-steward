<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="470" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">steward — zsh</text>
<text class="l1" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward sc node-patch 26.13.0</tspan></text>
<text class="l2" x="24" y="86" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">verify official tarball against SHASUMS256.txt</tspan></text>
<text class="l3" x="24" y="106" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">   ✓ </tspan><tspan fill="#c9d1d9">download SHASUMS256.txt</tspan></text>
<text class="l4" x="24" y="126" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">   ✓ </tspan><tspan fill="#c9d1d9">download node-v26.13.0-darwin-arm64.tar.gz</tspan></text>
<text class="l5" x="24" y="146" xml:space="preserve"><tspan fill="#3fb950">node-v26.13.0-darwin-arm64.tar.gz: OK</tspan></text>
<text class="l6" x="24" y="166" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">config backup: ~/.config/mise/backups/config.toml.20261028-140512</tspan></text>
<text class="l7" x="24" y="186" xml:space="preserve"><tspan fill="#8b949e">   $ mise install node@26.13.0</tspan></text>
<text class="l8" x="24" y="206" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#3fb950">installed bin/node is byte-identical to the official build</tspan></text>
<text class="l9" x="24" y="226" xml:space="preserve"><tspan fill="#8b949e">   $ mise use -g node@26.13.0</tspan></text>
<text class="l10" x="24" y="246" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">reinstall hybrids into Node 26.13.0 (each separately, reviewed allow-scripts)</tspan></text>
<text class="l11" x="24" y="266" xml:space="preserve"><tspan fill="#8b949e">   $ mise reshim</tspan></text>
<text class="l12" x="24" y="286" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#3fb950">all checks passed</tspan></text>
<text class="l13" x="24" y="306" xml:space="preserve"><tspan fill="#8b949e">   $ mise lock --global node</tspan></text>
<text class="l14" x="24" y="326" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">done. Node 26.12.1 stays installed (rollback). Relax the pin to the major after 3 days.</tspan></text>
</svg>
