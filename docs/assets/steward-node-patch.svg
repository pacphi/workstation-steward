<svg xmlns="http://www.w3.org/2000/svg" width="940" height="368" viewBox="0 0 940 368" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: patching Node</title>
<desc id="d">An illustrative steward sc node-patch 26.13.0, looping. It checks the official tarball against nodejs.org's SHASUMS256.txt, backs up the mise config, installs Node 26.13.0, confirms the installed binary is byte-identical to the official build, pins it, reinstalls the npm -g tools into it one by one, verifies, and keeps the previous Node installed for rollback.</desc>
