<svg xmlns="http://www.w3.org/2000/svg" width="940" height="368" viewBox="0 0 940 368" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: installing the Claude Code skills</title>
<desc id="d">An illustrative session, looping, in two scenes. steward skills install shows what it will install (the four skills, from the installed steward's own marketplace file; nothing is fetched), what it changes and how to undo it, asks, and installs the steward plugin for every Claude Code session. Then, in Claude Code, typing /steward: lists the four skills.</desc>
