<text x="470" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">steward — zsh</text>
<text class="l1" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward skills install</tspan></text>
<text class="l2" x="24" y="86" xml:space="preserve"><tspan fill="#c9d1d9">steward skills install: the steward's Claude Code skills, in every Claude Code session you start, in any</tspan></text>
<text class="l3" x="24" y="106" xml:space="preserve"><tspan fill="#c9d1d9">folder (Claude's user scope)</tspan></text>
<text class="l4" x="24" y="126" xml:space="preserve"><tspan fill="#c9d1d9">  skills:   supply-chain, ai-tooling, projects, pr-consolidation (from your add-ons)</tspan></text>
<text class="l5" x="24" y="146" xml:space="preserve"><tspan fill="#c9d1d9">  accepts:  the plugin's command `steward skills path`, which Claude Code runs each session (from this</tspan></text>
<text class="l6" x="24" y="166" xml:space="preserve"><tspan fill="#c9d1d9">            release's own marketplace file, copied to ~/.local/state/…/skills/marketplace; nothing is fetched)</tspan></text>
<text class="l7" x="24" y="186" xml:space="preserve"><tspan fill="#c9d1d9">  runs:     claude plugin install steward --marketplace ~/.local/state/…/skills/marketplace --scope user --yes</tspan></text>
<text class="l8" x="24" y="206" xml:space="preserve"><tspan fill="#c9d1d9">  changes:  ~/.claude/settings.json, ~/.claude/plugins/</tspan></text>
<text class="l9" x="24" y="226" xml:space="preserve"><tspan fill="#c9d1d9">  undo:     steward skills uninstall</tspan></text>
<text class="l10" x="24" y="246" xml:space="preserve"><tspan fill="#c9d1d9">Install? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l11" x="24" y="266" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">✔ </tspan><tspan fill="#c9d1d9">Successfully added marketplace: workstation-steward (declared in user settings)</tspan></text>
<text class="l12" x="24" y="286" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">✔ </tspan><tspan fill="#c9d1d9">Successfully installed plugin: steward@workstation-steward (scope: user)</tspan></text>
<text class="l13" x="24" y="306" xml:space="preserve"><tspan fill="#8b949e">Receipt: ~/.local/state/workstation-steward/backups/skills-install-20261028T155348/receipt.json</tspan></text>
<text class="l14" x="24" y="326" xml:space="preserve"><tspan fill="#c9d1d9">Installed: steward@workstation-steward. A new Claude Code session loads /steward:supply-chain and the rest.</tspan></text>
<text class="l15" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">claude</tspan></text>
<text class="l16" x="24" y="86" xml:space="preserve"><tspan fill="#d97757" font-weight="600">&gt; </tspan><tspan fill="#f0f6fc" font-weight="600">/steward:</tspan></text>
<text class="l17" x="24" y="106" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">  /steward:supply-chain      </tspan><tspan fill="#8b949e">Keeps this machine's software supply chain current within policy…</tspan></text>
<text class="l18" x="24" y="126" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">  /steward:ai-tooling        </tspan><tspan fill="#8b949e">Keeps this machine's AI tooling consistent with policy…</tspan></text>
<text class="l19" x="24" y="146" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">  /steward:projects          </tspan><tspan fill="#8b949e">Discovers projects under the project roots set in steward.toml…</tspan></text>
<text class="l20" x="24" y="166" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">  /steward:pr-consolidation  </tspan><tspan fill="#8b949e">Consolidates open Dependabot and/or Renovate dependency PRs…</tspan></text>
<text class="l21" x="24" y="186" xml:space="preserve"><tspan fill="#c9d1d9"></tspan></text>
<text class="l22" x="24" y="206" xml:space="preserve"><tspan fill="#8b949e"># or skip the slash: ask in plain words, and Claude picks the skill</tspan></text>
</svg>
