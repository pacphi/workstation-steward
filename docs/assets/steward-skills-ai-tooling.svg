<svg xmlns="http://www.w3.org/2000/svg" width="940" height="308" viewBox="0 0 940 308" role="img" aria-labelledby="t d">
<title id="t">workstation-steward in Claude Code: is the AI tooling OK?</title>
<desc id="d">An illustrative Claude Code session, looping, in two scenes. Asked whether the AI tooling is OK, the ai-tooling skill runs steward ai drift and explains its one finding: three launcher configs still start Node 26.4.0 by its exact path, missing later security fixes and due to break when it is pruned. It offers three choices; after the user picks the fix, it shows the repin plan, asks, applies it with a receipt, runs drift again (clean), and says how to undo it.</desc>
