<svg xmlns="http://www.w3.org/2000/svg" width="940" height="368" viewBox="0 0 940 368" role="img" aria-labelledby="t d">
<title id="t">workstation-steward in Claude Code: set up a new repo</title>
<desc id="d">An illustrative Claude Code session, looping, in two scenes. Told about a newly cloned repo, the projects skill runs steward projects scan and facets, describes the repo, and offers three choices. After the user picks onboarding with AQE and Brain, it records the decision, shows the onboard plan (nine files, kept out of git status), asks, applies it with a receipt, and names the one step left to the user.</desc>
