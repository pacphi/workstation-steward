<svg xmlns="http://www.w3.org/2000/svg" width="940" height="288" viewBox="0 0 940 288" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: PR consolidation in Claude Code</title>
<desc id="d">A retelling of the real pacphi/ampel#86, looping. In Claude Code, /steward:pr-consolidation works in a fresh clone, finds three Dependabot PRs, takes the two in-major bumps (axios, vite) that are at least three days old, defers the major one with its breaking changes written up, fixes twelve RustSec vulnerabilities with lockfile-only updates, justifies one ignore that has no fix without a major, and opens one PR with every CI job green. Merging stays the owner's decision.</desc>
