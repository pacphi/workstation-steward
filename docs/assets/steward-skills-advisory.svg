<svg xmlns="http://www.w3.org/2000/svg" width="940" height="368" viewBox="0 0 940 368" role="img" aria-labelledby="t d">
<title id="t">workstation-steward in Claude Code: is this advisory a problem here?</title>
<desc id="d">An illustrative Claude Code session, looping, in one scene. Asked whether last week's LiteLLM backdoor affects the Mac, the supply-chain skill reads the GitHub advisory, notes that the steward's shared indicators already cover it, runs steward sc audit (clean), and checks for the package and the image directly. It answers that the Mac is not exposed and that it changed nothing.</desc>
