<text x="470" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">claude — ~</text>
<text class="l1" x="24" y="66" xml:space="preserve"><tspan fill="#d97757" font-weight="600">&gt; </tspan><tspan fill="#f0f6fc" font-weight="600">is the LiteLLM backdoor from last week a problem on this Mac?</tspan></text>
<text class="l2" x="24" y="86" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9" font-weight="600">Skill</tspan><tspan fill="#c9d1d9">(steward:supply-chain)</tspan></text>
<text class="l3" x="24" y="106" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9" font-weight="600">Fetch</tspan><tspan fill="#c9d1d9">(https://github.com/advisories/GHSA-92x9-889m-jgmw)</tspan></text>
<text class="l4" x="24" y="126" xml:space="preserve"><tspan fill="#8b949e">  ⎿  LiteLLM 1.107.0 on PyPI and Docker Hub: a malicious release, published 2026-10-21</tspan></text>
<text class="l5" x="24" y="146" xml:space="preserve"><tspan fill="#d97757" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9">The steward already watches for it: its shared indicators list the backdoor's files, its cook.pth</tspan></text>
<text class="l6" x="24" y="166" xml:space="preserve"><tspan fill="#c9d1d9">  in Python's site-packages, its processes and the image digest. Checking this Mac:</tspan></text>
<text class="l7" x="24" y="186" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9" font-weight="600">Bash</tspan><tspan fill="#c9d1d9">(steward sc audit)</tspan></text>
<text class="l8" x="24" y="206" xml:space="preserve"><tspan fill="#8b949e">  ⎿  clean  LiteLLM 1.107.0 PyPI/Docker backdoor (2026-10-21) (default)</tspan></text>
<text class="l9" x="24" y="226" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9" font-weight="600">Bash</tspan><tspan fill="#c9d1d9">(find ~ -path '*site-packages/litellm-1.107.0*' 2&gt;/dev/null)</tspan></text>
<text class="l10" x="24" y="246" xml:space="preserve"><tspan fill="#8b949e">  ⎿  (no output)</tspan></text>
<text class="l11" x="24" y="266" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9" font-weight="600">Bash</tspan><tspan fill="#c9d1d9">(docker images --digests | grep -i litellm)</tspan></text>
<text class="l12" x="24" y="286" xml:space="preserve"><tspan fill="#8b949e">  ⎿  (no output)</tspan></text>
<text class="l13" x="24" y="306" xml:space="preserve"><tspan fill="#d97757" font-weight="600">⏺ </tspan><tspan fill="#c9d1d9">Not exposed. LiteLLM 1.107.0 isn't installed, no image has the bad digest, and none of its files or</tspan></text>
<text class="l14" x="24" y="326" xml:space="preserve"><tspan fill="#c9d1d9">  processes are here. Every `steward sc audit` keeps checking for it. I changed nothing.</tspan></text>
</svg>
