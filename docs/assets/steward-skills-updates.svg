<svg xmlns="http://www.w3.org/2000/svg" width="940" height="408" viewBox="0 0 940 408" role="img" aria-labelledby="t d">
<title id="t">workstation-steward in Claude Code: what needs updating?</title>
<desc id="d">An illustrative Claude Code session, looping, in two scenes. Asked what needs updating, the supply-chain skill runs steward sc audit and steward sc plan without asking, since both are read-only, and sorts the results: gh is past the 3-day gate, Chrome should be updated now, a two-day-old python waits, a postgres major is the user's call, and a Docker container uses a floating tag. It offers three choices; after the user picks the upgrade, it shows the dry run, asks before upgrading, verifies every tool, and says how to roll back.</desc>
