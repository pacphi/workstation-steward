<svg xmlns="http://www.w3.org/2000/svg" width="940" height="308" viewBox="0 0 940 308" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: a safe upgrade, and its undo</title>
<desc id="d">An illustrative steward sc upgrade, looping. The plan takes gh 2.103.2 and holds a two-day-old python release; after a yes it backs up the mise config, upgrades gh without pruning the old version, verifies every tool and records a receipt. Then steward sc rollback restores the backed-up config after another yes.</desc>
