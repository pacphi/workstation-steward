<text x="470" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">steward — zsh</text>
<text class="l1" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward sc upgrade</tspan></text>
<text class="l2" x="24" y="86" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9" font-weight="600">mise tools (mise already applies minimum_release_age)</tspan></text>
<text class="l3" x="24" y="106" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  take   </tspan><tspan fill="#c9d1d9">gh 2.103.1 -&gt; 2.103.2</tspan></text>
<text class="l4" x="24" y="126" xml:space="preserve"><tspan fill="#d29922" font-weight="600">  hold   </tspan><tspan fill="#c9d1d9">python 3.15.1 -&gt; 3.15.2 (2d old)</tspan></text>
<text class="l5" x="24" y="146" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9" font-weight="600">plan: 0 formula(e), 0 cask(s), 1 mise tool(s)</tspan></text>
<text class="l6" x="24" y="166" xml:space="preserve"><tspan fill="#c9d1d9">Apply this plan? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l7" x="24" y="186" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">config backup: ~/.config/mise/backups/config.toml.20261028-112629</tspan></text>
<text class="l8" x="24" y="206" xml:space="preserve"><tspan fill="#8b949e">   $ mise upgrade --bump --no-prune gh</tspan></text>
<text class="l9" x="24" y="226" xml:space="preserve"><tspan fill="#8b949e">   $ mise reshim</tspan></text>
<text class="l10" x="24" y="246" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#3fb950">all checks passed</tspan></text>
<text class="l11" x="24" y="266" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">done. rollback: steward sc rollback   (restores ~/.config/mise/backups/config.toml.20261028-112629)</tspan></text>
<text class="l12" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward sc rollback</tspan></text>
<text class="l13" x="24" y="86" xml:space="preserve"><tspan fill="#c9d1d9">Restore this config? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l14" x="24" y="106" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">restoring ~/.config/mise/backups/config.toml.20261028-112629</tspan></text>
<text class="l15" x="24" y="126" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9">restored. Check with: steward sc verify</tspan></text>
</svg>
