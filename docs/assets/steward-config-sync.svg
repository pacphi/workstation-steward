<svg xmlns="http://www.w3.org/2000/svg" width="940" height="348" viewBox="0 0 940 348" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: what the steward tells you about your config repo</title>
<desc id="d">An illustrative session, looping, in three scenes. A bare steward shows a banner line: one file changed here and one newer commit on GitHub, as of the last fetch, pointing to steward config. steward config ends with the repo section: the GitHub repository and branch, the changed file, and the newer commit, each with the git command that acts on it. steward review fetches the config repo and lists the same items, plus its open pull requests on GitHub, such as Renovate's.</desc>
