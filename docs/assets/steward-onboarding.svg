<text x="470" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">steward — zsh</text>
<text class="l1" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">npm view workstation-steward@0.2.1 dist.attestations.provenance.predicateType</tspan></text>
<text class="l2" x="24" y="86" xml:space="preserve"><tspan fill="#3fb950">https://slsa.dev/provenance/v1</tspan></text>
<text class="l3" x="24" y="106" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">mise use -g 'npm:workstation-steward[allow_low_downloads=true]@0.2.1'</tspan></text>
<text class="l4" x="24" y="126" xml:space="preserve"><tspan fill="#8b949e">mise </tspan><tspan fill="#3fb950" font-weight="600">✓ </tspan><tspan fill="#c9d1d9">npm:workstation-steward@0.2.1</tspan></text>
<text class="l5" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward init</tspan></text>
<text class="l6" x="24" y="86" xml:space="preserve"><tspan fill="#c9d1d9">steward init: create your config in ~/.config/workstation-steward from the examples (9 files):</tspan></text>
<text class="l7" x="24" y="106" xml:space="preserve"><tspan fill="#c9d1d9">Create these? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l8" x="24" y="126" xml:space="preserve"><tspan fill="#8b949e">Created 9 files. Receipt: ~/.local/state/workstation-steward/backups/init-…/receipt.json</tspan></text>
<text class="l9" x="24" y="146" xml:space="preserve"><tspan fill="#58a6ff">A few questions finish the setup. Each answer changes one line in steward.toml.</tspan></text>
<text class="l10" x="24" y="166" xml:space="preserve"><tspan fill="#c9d1d9">Turn on the AI tooling add-on (Ruflo, AgentDB, AQE, Brain, RuVector: drift, repin, guards)? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">n</tspan></text>
<text class="l11" x="24" y="186" xml:space="preserve"><tspan fill="#c9d1d9">Turn on the projects add-on (discovery, the registry and onboarding of your projects)? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l12" x="24" y="206" xml:space="preserve"><tspan fill="#c9d1d9">Where do your projects live? Folders, separated by commas [~/Development]: </tspan><tspan fill="#79c0ff" font-weight="600">⏎</tspan></text>
<text class="l13" x="24" y="226" xml:space="preserve"><tspan fill="#c9d1d9">Install the steward's Claude Code skills (/steward:supply-chain and the rest)?</tspan></text>
<text class="l14" x="24" y="246" xml:space="preserve"><tspan fill="#c9d1d9">  1) everywhere: every Claude Code session you start, in any folder</tspan></text>
<text class="l15" x="24" y="266" xml:space="preserve"><tspan fill="#c9d1d9">  2) one project: only sessions started in a folder you name    3) not now</tspan></text>
<text class="l16" x="24" y="286" xml:space="preserve"><tspan fill="#c9d1d9">Choose 1, 2 or 3 [3]: </tspan><tspan fill="#79c0ff" font-weight="600">1</tspan></text>
<text class="l17" x="24" y="306" xml:space="preserve"><tspan fill="#c9d1d9">Also include PR consolidation (folds a repo's Dependabot and Renovate PRs into one verified PR)? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l18" x="24" y="326" xml:space="preserve"><tspan fill="#8b949e">Set in ~/.config/workstation-steward/steward.toml: profiles.projects = true; skills.pr_consolidation = true</tspan></text>
<text class="l19" x="24" y="346" xml:space="preserve"><tspan fill="#c9d1d9">Install? [y/N] </tspan><tspan fill="#79c0ff" font-weight="600">y</tspan></text>
<text class="l20" x="24" y="366" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">✔ </tspan><tspan fill="#c9d1d9">Successfully installed plugin: steward@workstation-steward (scope: user)</tspan></text>
<text class="l21" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward sc plan</tspan></text>
<text class="l22" x="24" y="86" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9" font-weight="600">Homebrew formulae</tspan></text>
<text class="l23" x="24" y="106" xml:space="preserve"><tspan fill="#d29922" font-weight="600">  hold   </tspan><tspan fill="#c9d1d9">python@3.15 3.15.1 -&gt; 3.15.2 (2d old)</tspan></text>
<text class="l24" x="24" y="126" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9" font-weight="600">mise tools (mise already applies minimum_release_age)</tspan></text>
<text class="l25" x="24" y="146" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">  take   </tspan><tspan fill="#c9d1d9">gh 2.103.1 -&gt; 2.103.2</tspan></text>
<text class="l26" x="24" y="166" xml:space="preserve"><tspan fill="#db6d28" font-weight="600">  skip   </tspan><tspan fill="#c9d1d9">postgres 16.15 -&gt; 18 (major: upgrade deliberately with steward sc upgrade-tool postgres &lt;version&gt;)</tspan></text>
<text class="l27" x="24" y="186" xml:space="preserve"><tspan fill="#58a6ff" font-weight="600">==&gt; </tspan><tspan fill="#c9d1d9" font-weight="600">plan: 0 formula(e), 0 cask(s), 1 mise tool(s)</tspan></text>
<text class="l28" x="24" y="206" xml:space="preserve"><tspan fill="#c9d1d9"></tspan></text>
