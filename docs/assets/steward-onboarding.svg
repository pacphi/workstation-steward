<svg xmlns="http://www.w3.org/2000/svg" width="940" height="408" viewBox="0 0 940 408" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: a first session in the terminal</title>
<desc id="d">An illustrative session, looping. It checks the npm release's provenance (SLSA v1), installs it through mise, runs steward init (nine files created with a receipt; the AI tooling add-on off, the projects add-on on under ~/Development, the Claude Code skills installed everywhere with PR consolidation), then runs steward sc plan, which takes gh 2.103.2, holds python@3.15 3.15.2 because it is two days old, and skips postgres 18 because a major upgrade is deliberate.</desc>
