<svg xmlns="http://www.w3.org/2000/svg" width="940" height="228" viewBox="0 0 940 228" role="img" aria-labelledby="t d">
<title id="t">workstation-steward: what needs you, in one line</title>
<desc id="d">An illustrative steward brief, looping. A steward upgrade stopped after one of its two parts, so the briefing names it in red as something to fix, with the one next step: run steward upgrade again, whose plan shows only the part left. steward brief --all lists every finding with its command and why: the unfinished upgrade, then a review that is due. Once the upgrade has finished and a review has run, steward brief says nothing needs you. It only reads; nothing is changed.</desc>
