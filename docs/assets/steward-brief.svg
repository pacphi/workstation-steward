<text x="470" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">steward — zsh</text>
<text class="l1" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward brief</tspan></text>
<text class="l2" x="24" y="86" xml:space="preserve"><tspan fill="#f85149" font-weight="600">steward </tspan><tspan fill="#c9d1d9">upgrade stopped midway: 1 of 2 part(s) done</tspan></text>
<text class="l3" x="24" y="106" xml:space="preserve"><tspan fill="#8b949e">next: </tspan><tspan fill="#79c0ff">steward upgrade</tspan></text>
<text class="l4" x="24" y="126" xml:space="preserve"><tspan fill="#8b949e">+1 more: steward brief --all</tspan></text>
<text class="l5" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward brief --all</tspan></text>
<text class="l6" x="24" y="86" xml:space="preserve"><tspan fill="#c9d1d9">[fix] upgrade stopped midway: 1 of 2 part(s) done</tspan></text>
<text class="l7" x="24" y="106" xml:space="preserve"><tspan fill="#8b949e">  → </tspan><tspan fill="#79c0ff">steward upgrade</tspan><tspan fill="#8b949e">   (changes things: it asks first)</tspan></text>
<text class="l8" x="24" y="126" xml:space="preserve"><tspan fill="#8b949e">    each part it ran wrote its own receipt (~/.local/state/workstation-steward/backups/coarse-upgrade-2026103…</tspan></text>
<text class="l9" x="24" y="146" xml:space="preserve"><tspan fill="#c9d1d9">[do] a review is due (never run)</tspan></text>
<text class="l10" x="24" y="166" xml:space="preserve"><tspan fill="#8b949e">  → </tspan><tspan fill="#79c0ff">steward review</tspan></text>
<text class="l11" x="24" y="186" xml:space="preserve"><tspan fill="#8b949e">    one read-only pass over every area: what needs a decision, each with its command</tspan></text>
<text class="l12" x="24" y="66" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#f0f6fc" font-weight="600">steward brief</tspan></text>
<text class="l13" x="24" y="86" xml:space="preserve"><tspan fill="#3fb950" font-weight="600">steward </tspan><tspan fill="#c9d1d9">nothing needs you</tspan></text>
</svg>
